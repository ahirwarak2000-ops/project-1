<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Git Practice</title>

    <!-- Internal CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #34495e;
            padding: 10px;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>My Git Practice Website</h1>
        <p>HTML & CSS Practice Template</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <div class="container">

        <div class="card">
            <h2>About Me</h2>
            <p>This is a sample paragraph for HTML practice.</p>
        </div>

        <div class="card">
            <h2>Services</h2>
            <ul>
                <li>Web Design</li>
                <li>Development</li>
                <li>SEO</li>
            </ul>
        </div>

        <div class="card">
            <h2>Contact Form</h2>
            <form>
                <label>Name:</label><br>
                <input type="text"><br><br>

                <label>Email:</label><br>
                <input type="email"><br><br>

                <label>Message:</label><br>
                <textarea rows="4"></textarea><br><br>

                <button type="submit">Submit</button>
            </form>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Practice Site</p>
    </footer>

</body>
</html>
